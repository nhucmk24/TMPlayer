name: Build Windows MSI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Create local.properties
      shell: bash
      run: |
        echo "TG_API_ID=${{ secrets.TG_API_ID }}" > local.properties
        echo "TG_API_HASH=${{ secrets.TG_API_HASH }}" >> local.properties

    - name: Build Windows MSI installer
      run: ./gradlew :desktop:packageReleaseMsi

    - name: Upload MSI artifact
      uses: actions/upload-artifact@v4
      with:
        name: Clowphim-Windows-MSI
        path: |
          desktop/build/compose/binaries/**/*.msi
          desktop/build/compose/binaries/**/*.exe
