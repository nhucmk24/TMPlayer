name: Build Windows MSI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Windows App and Installers
      run: ./gradlew :desktop:packageReleaseDeb :desktop:packageReleaseMsi :desktop:createReleaseDistributable

    - name: Upload all desktop binaries
      uses: actions/upload-artifact@v4
      with:
        name: Clowphim-Windows-Files
        path: desktop/build/compose/binaries/main/
